# Spike S7 (#3): measure an Android CI on GitHub Actions.
# Disposable — the real CI is defined after the spike (decision D19).
name: Spike CI

on:
  push:
    branches: [spike/3-github-actions-ci]
    paths: ["spike-ci/**", ".github/workflows/spike-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spike-ci
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25 (matches gradle-daemon-jvm.properties)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (wrapper validation + cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          # Spike only: allow writing the cache from this branch to measure its effect.
          # By default the cache is only written from the default branch (main).
          cache-read-only: false

      - name: Build
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: spike-ci/app/build/reports/
          retention-days: 7
